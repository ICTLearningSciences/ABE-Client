version: 0.2

env:
  variables:
    STAGE: 'prod'
    VITE_GOOGLE_API_ENDPOINT: "https://api.abewriting.org/docs"
    VITE_GRAPHQL_ENDPOINT: "https://api.abewriting.org/graphql/graphql"
    VITE_DOCUMENT_SERVICE: "GOOGLE_DOCS"
    VITE_COGNITO_REDIRECT_URI: "https://abewriting.org"
    VITE_COGNITO_LOGOUT_REDIRECT_URI: "https://abewriting.org"
    VITE_AWS_S3_REGION: "us-east-1"
  parameter-store:
    S3_DEPLOY_BUCKET_PROD: "/abewriting/prod/s3-websites/NAME"
    CDN_ID_PROD: "/abewriting/prod/CLOUDFRONT_DISTRIBUTION_ID"
    VITE_GOOGLE_CLIENT_ID: "/ABE/google_client_id"
    VITE_COGNITO_DOMAIN: "/ABE/COGNITO_DOMAIN"
    VITE_COGNITO_CLIENT_ID: "/ABE/COGNITO_CLIENT_ID"
    VITE_COGNITO_AUTHORITY: "/ABE/COGNITO_AUTHORITY"
    VITE_AWS_ACCESSKEY: "/ABE/AWS_ACCESSKEY"
    VITE_AWS_SECRETACCESSKEY: "/ABE/AWS_SECRETACCESSKEY"

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - n 24

  build:
    commands:
      - npm run build
      - echo Deploying to $S3_DEPLOY_BUCKET_PROD
      - aws s3 sync ./dist s3://$S3_DEPLOY_BUCKET_PROD
      - aws cloudfront create-invalidation --distribution-id $CDN_ID_PROD --paths "/*"
