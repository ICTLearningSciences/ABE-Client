version: 0.2

env:
  variables:
    STAGE: 'qa'
    VITE_GOOGLE_API_ENDPOINT: "https://api-qa.abewriting.org/docs"
    VITE_GRAPHQL_ENDPOINT: "https://api-qa.abewriting.org/graphql/graphql"
  parameter-store:
    S3_DEPLOY_BUCKET_QA: "/abewriting/qa/s3-websites/NAME"
    CDN_ID_QA: "/abewriting/qa/CLOUDFRONT_DISTRIBUTION_ID"
    VITE_GOOGLE_CLIENT_ID: "/ABE/google_client_id"
    VITE_COGNITO_CLIENT_ID: "/ABE/VITE_COGNITO_CLIENT_ID"
    VITE_COGNITO_AUTHORITY: "/ABE/VITE_COGNITO_AUTHORITY"

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - n 24

  build:
    commands:
      - npm run build
      - echo Deploying to $S3_DEPLOY_BUCKET_QA
      - aws s3 sync ./dist s3://$S3_DEPLOY_BUCKET_QA
      - aws cloudfront create-invalidation --distribution-id $CDN_ID_QA --paths "/*"
